<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Akan Yazı</title>
<!-- viewport-fit=cover: içerik çentik/ada ve ev çubuğu altına kadar uzanır -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akan Yazı">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #000000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Safe area boşluğu YOK: env(safe-area-inset-*) bilerek kullanılmadı */
  html, body {
    width: 100%;
    height: var(--full-h, 100%);
    min-height: 100%;
    background: var(--bg);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* Oyun sahnesi: şimdilik saf siyah, yazı yok. Kartlar buraya gelecek. */
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: var(--full-h, 100%);
    overflow: hidden;
    background: var(--bg);
  }

  /* ---- Kart ---- */
  :root { --cw: min(70vw, 290px); --ch: calc(var(--cw) * 4 / 3); }
  .stage { display: flex; align-items: center; justify-content: center; pointer-events: none; }

  .card {
    position: relative; z-index: 2; pointer-events: auto;
    width: var(--cw); aspect-ratio: 3 / 4;
    padding: 10px;
    display: flex; flex-direction: column;
    border-radius: 24px;
    background: #efeae0;
    transform-origin: 50% 130%;          /* kart elde tutuluyormuş gibi alttan sallanır */
    touch-action: none;
    cursor: grab;
    will-change: transform, opacity;
    opacity: 0;
  }
  .card * { pointer-events: none; }
  .card.dragging { cursor: grabbing; }

  .art { position: relative; flex: 1; overflow: hidden; border-radius: 16px; background: #b5573f; }
  .art i {
    position: absolute; left: 50%; bottom: -24%;
    width: 78%; aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%); background: #c8705a;
  }
  .meta { padding: 14px 10px 8px; font-family: Georgia, 'Times New Roman', serif; color: #2a2520; }
  .spk { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .5; margin-bottom: 7px; }
  .txt { font-size: 16px; line-height: 1.35; }

  /* Seçenekler: arka planın tamamı o tarafın rengine süzülür, seçenek metni kartın üstünde belirir */
  .side { position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none; will-change: opacity; }
  .side.left {
    background:
      radial-gradient(95% 75% at 0% 55%, rgba(84,122,146,.55), rgba(84,122,146,.12) 62%, transparent 100%),
      linear-gradient(90deg, rgba(84,122,146,.16), transparent 75%);
  }
  .side.right {
    background:
      radial-gradient(95% 75% at 100% 55%, rgba(200,108,82,.55), rgba(200,108,82,.12) 62%, transparent 100%),
      linear-gradient(270deg, rgba(200,108,82,.16), transparent 75%);
  }
  .opt {
    position: absolute; left: 26px; right: 26px;
    bottom: calc(50% + var(--ch) / 2 + 28px);
    font: 30px/1.15 Georgia, 'Times New Roman', serif; color: #f1ebe0;
    opacity: 0; will-change: transform, opacity;
  }
  .side.left .opt { text-align: left; }
  .side.right .opt { text-align: right; }

  /* Gizli seçenek: yukarı/aşağı, arka planla kamufle; kart yaklaştıkça belirir ve parlar */
  .side.hid.up   { background: radial-gradient(90% 42% at 50% 0%,   rgba(224,190,122,.42), rgba(224,190,122,.10) 60%, transparent 100%); }
  .side.hid.down { background: radial-gradient(90% 42% at 50% 100%, rgba(224,190,122,.42), rgba(224,190,122,.10) 60%, transparent 100%); }
  .hopt {
    position: absolute; left: 26px; right: 26px; text-align: center;
    font: italic 22px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: .04em;
    color: #f4e3bd;
    text-shadow: 0 0 18px rgba(240,200,130,.7), 0 1px 0 rgba(0,0,0,.55);
    opacity: 0; will-change: transform, opacity;
  }
  .side.hid.up   .hopt { top: max(28px, calc(50% - var(--ch) / 2 - 150px)); }
  .side.hid.down .hopt { bottom: max(28px, calc(50% - var(--ch) / 2 - 150px)); }

  .end {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 0 32px;
    font-family: Georgia, 'Times New Roman', serif; color: #f1ebe0;
    opacity: 0; transition: opacity .9s ease; pointer-events: none;
  }
  .end.show { opacity: 1; pointer-events: auto; }
  .end p { font-size: 26px; line-height: 1.25; }
  .end small { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .45; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="side left" id="sideL"><div class="opt" id="optL"></div></div>
  <div class="side right" id="sideR"><div class="opt" id="optR"></div></div>
  <div class="side hid up" id="sideH"><div class="hopt" id="optH"></div></div>
  <div class="card" id="card">
    <div class="art"><i></i></div>
    <div class="meta"><span class="spk" id="spk"></span><div class="txt" id="txt"></div></div>
  </div>
  <div class="end" id="end"><p id="endT"></p><small>Dokun ve yeniden başla</small></div>
</div>

<script>
/* Kart verisi — hikaye burada yazılır, motor (game.js) bunu okur.
 *
 * Kart şeması:
 * {
 *   id:       benzersiz anahtar
 *   speaker:  konuşan karakter
 *   text:     kartın metni
 *   left / right: {                      // sola / sağa kaydırma seçimi
 *     label:   seçim etiketi
 *     effects: { faith, people, army, wealth }   // + / - değişim
 *     set:     ['bayrak', ...]           // hikaye bayrakları koy
 *     unset:   ['bayrak', ...]           // hikaye bayraklarını kaldır
 *     next:    ['kartId', ...]           // sıradaki kartları zincirle
 *   }
 *   hidden:   { label, at:'up'|'down', effects, set, unset, next, requires }   // gizli üçüncü seçenek
 *   requires: { flags:[], notFlags:[], stat:{ army:{min:30,max:80} }, minTurn:0 }
 *   weight:   çekilme ağırlığı (varsayılan 1)
 *   once:     true ise bir kez çıkar
 * }
 */
window.CARDS = [
  {
    id: 'intro_advisor',
    speaker: 'Danışman',
    text: 'Majesteleri, taht odası sizi bekliyor.',
    left:  { label: 'Bekletin',  effects: { people: -5 } },
    right: { label: 'Geliyorum', effects: { people: 5 }, set: ['tahta_cikti'] },
    once: true
  },
  {
    id: 'harvest',
    speaker: 'Köylü',
    text: 'Hasat zayıf geçti. Vergiyi hafifletir misiniz?',
    left:  { label: 'Hayır',  effects: { people: -10, wealth: 8 } },
    right: { label: 'Evet',   effects: { people: 10, wealth: -8 } },
    requires: { flags: ['tahta_cikti'] },
    hidden: { label: 'Ambarı gizlice aç', at: 'up', effects: { people: 6, wealth: -3 }, set: ['ambar_acik'] }
  },
  {
    id: 'priest',
    speaker: 'Rahip',
    text: 'Eski tapınak çöküyor. Onarım için altın gerek.',
    left:  { label: 'Reddet', effects: { faith: -10 } },
    right: { label: 'Öde',    effects: { faith: 10, wealth: -10 } },
    requires: { flags: ['tahta_cikti'] },
    hidden: { label: 'Rahibi sına', at: 'down', effects: { faith: -3 }, set: ['rahip_sinandi'] }
  },
  {
    id: 'general',
    speaker: 'General',
    text: 'Sınırda hareketlilik var. Askeri arttıralım mı?',
    left:  { label: 'Gerek yok', effects: { army: -8 }, set: ['sinir_savunmasiz'] },
    right: { label: 'Arttır',    effects: { army: 10, wealth: -6 }, next: ['border_raid'] },
    requires: { flags: ['tahta_cikti'] },
    hidden: { label: 'Yabancının sırrını kullan', at: 'up', requires: { flags: ['sir_biliyor'] }, effects: { army: 6 } }
  },
  {
    id: 'border_raid',
    speaker: 'Haberci',
    text: 'Sınır köyleri akına uğradı!',
    left:  { label: 'Müdahale etme', effects: { people: -12 } },
    right: { label: 'Ordu gönder',   effects: { army: -6, people: 8 } },
    requires: { flags: ['sinir_savunmasiz'] },
    weight: 3
  },
  {
    id: 'stranger',
    speaker: 'Yabancı',
    text: 'Size bir sır satmak istiyorum.',
    left:  { label: 'Kov',     effects: {} },
    right: { label: 'Dinle',   effects: { wealth: -5 }, set: ['sir_biliyor'] },
    requires: { flags: ['tahta_cikti'], minTurn: 3 },
    once: true
  }
];

/* Oyun sonları: bir istatistik 0'a ya da 100'e değince tetiklenir. */
window.ENDINGS = {
  faith:  { low: { id: 'end_faith_low',  text: 'İnancın söndü.' },
            high: { id: 'end_faith_high', text: 'Din, tahtı yuttu.' } },
  people: { low: { id: 'end_people_low',  text: 'Halk ayaklandı.' },
            high: { id: 'end_people_high', text: 'Halk seni tahttan indirdi.' } },
  army:   { low: { id: 'end_army_low',  text: 'Ordu dağıldı.' },
            high: { id: 'end_army_high', text: 'Generaller darbe yaptı.' } },
  wealth: { low: { id: 'end_wealth_low',  text: 'Hazine boşaldı.' },
            high: { id: 'end_wealth_high', text: 'Servet, seni yozlaştırdı.' } }
};

/* Oyun çekirdeği (Reigns tarzı): durum, deste, seçim, son kontrolü, kaydırma girişi.
 * Arayüz yok — ileride render katmanı Game olaylarını dinleyerek kartı çizecek.
 *
 * Olaylar (stage üzerinde CustomEvent):
 *   'card'   → { card }                 yeni kart çekildi
 *   'choice' → { card, dir, result }    seçim yapıldı
 *   'end'    → { ending }               oyun bitti
 *   'swipe'  → { dir, dx }              ham kaydırma (left | right)
 *   'drag'   → { dx, ratio }            sürükleme sırasında (-1..1)
 */
(function () {
  var STATS = ['faith', 'people', 'army', 'wealth'];
  var SAVE_KEY = 'akan-yazi-save-v1';
  var SWIPE_MIN = 60; // px

  var Game = {
    el: null,
    state: null,
    current: null,

    init: function (el) {
      this.el = el;
      this.state = this.load() || this.fresh();
      this.bindInput();
      if (!this.state.over) this.draw();
    },

    fresh: function () {
      var s = { turn: 0, stats: {}, flags: {}, seen: {}, queue: [], over: false, ending: null };
      STATS.forEach(function (k) { s.stats[k] = 50; });
      return s;
    },

    reset: function () {
      this.state = this.fresh();
      this.save();
      this.draw();
    },

    // --- Deste -------------------------------------------------------------
    // Koşul kontrolü (kart ve gizli seçenek için ortak)
    meets: function (r) {
      var s = this.state; r = r || {};
      if (r.minTurn && s.turn < r.minTurn) return false;
      if (r.flags && !r.flags.every(function (f) { return s.flags[f]; })) return false;
      if (r.notFlags && r.notFlags.some(function (f) { return s.flags[f]; })) return false;
      if (r.stat) {
        for (var k in r.stat) {
          var v = s.stats[k], c = r.stat[k];
          if (c.min != null && v < c.min) return false;
          if (c.max != null && v > c.max) return false;
        }
      }
      return true;
    },

    eligible: function (card) {
      if (card.once && this.state.seen[card.id]) return false;
      return this.meets(card.requires);
    },

    // Kartın gizli seçeneği varsa ve şartı sağlanıyorsa döner, yoksa null
    hiddenOf: function (card) {
      return card && card.hidden && this.meets(card.hidden.requires) ? card.hidden : null;
    },

    byId: function (id) {
      return window.CARDS.filter(function (c) { return c.id === id; })[0] || null;
    },

    pick: function () {
      var s = this.state, card = null;
      while (s.queue.length && !card) {          // zincirlenen kartlar önce
        var q = this.byId(s.queue.shift());
        if (q && this.eligible(q)) card = q;
      }
      if (card) return card;
      var pool = window.CARDS.filter(this.eligible, this);
      if (!pool.length) return null;
      var total = pool.reduce(function (a, c) { return a + (c.weight || 1); }, 0);
      var roll = Math.random() * total;
      for (var i = 0; i < pool.length; i++) {
        roll -= (pool[i].weight || 1);
        if (roll <= 0) return pool[i];
      }
      return pool[pool.length - 1];
    },

    draw: function () {
      this.current = this.pick();
      if (this.current) this.emit('card', { card: this.current });
      return this.current;
    },

    // --- Seçim -------------------------------------------------------------
    choose: function (dir) {
      if (this.state.over || !this.current) return null;
      var card = this.current, opt = dir === 'hidden' ? this.hiddenOf(card) : card[dir];
      if (!opt) return null;
      var s = this.state;

      var e = opt.effects || {};
      STATS.forEach(function (k) {
        if (e[k]) s.stats[k] = Math.max(0, Math.min(100, s.stats[k] + e[k]));
      });
      (opt.set || []).forEach(function (f) { s.flags[f] = true; });
      (opt.unset || []).forEach(function (f) { delete s.flags[f]; });
      (opt.next || []).forEach(function (id) { s.queue.push(id); });
      s.seen[card.id] = true;
      s.turn++;

      var ending = this.checkEnd();
      var result = { stats: JSON.parse(JSON.stringify(s.stats)), ending: ending };
      this.emit('choice', { card: card, dir: dir, result: result });

      if (ending) {
        s.over = true; s.ending = ending;
        this.current = null;
        this.save();
        this.emit('end', { ending: ending });
      } else {
        this.save();
        this.draw();
      }
      return result;
    },

    checkEnd: function () {
      var s = this.state;
      for (var i = 0; i < STATS.length; i++) {
        var k = STATS[i], v = s.stats[k];
        if (v <= 0) return window.ENDINGS[k].low;
        if (v >= 100) return window.ENDINGS[k].high;
      }
      return null;
    },

    // --- Kayıt -------------------------------------------------------------
    save: function () {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.state)); } catch (e) {}
    },
    load: function () {
      try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
    },

    // --- Giriş: sola / sağa kaydırma --------------------------------------
    bindInput: function () {
      var self = this, el = this.el, x0 = null, dx = 0;
      window.__swiped = false;

      el.addEventListener('pointerdown', function (e) {
        x0 = e.clientX; dx = 0; window.__swiped = false;
      });
      el.addEventListener('pointermove', function (e) {
        if (x0 === null) return;
        dx = e.clientX - x0;
        self.emit('drag', { dx: dx, ratio: Math.max(-1, Math.min(1, dx / (window.innerWidth / 2))) });
      });
      function up() {
        if (x0 === null) return;
        if (Math.abs(dx) >= SWIPE_MIN) {
          var dir = dx < 0 ? 'left' : 'right';
          window.__swiped = true;
          self.emit('swipe', { dir: dir, dx: dx });
          self.choose(dir);
        }
        x0 = null; dx = 0;
        self.emit('drag', { dx: 0, ratio: 0 });
      }
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      // Klavye (test için)
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') self.choose('left');
        if (e.key === 'ArrowRight') self.choose('right');
      });
    },

    emit: function (name, detail) {
      this.el.dispatchEvent(new CustomEvent(name, { detail: detail }));
    }
  };

  window.Game = Game;
})();
</script>
<script>
(function () {
  function setFullHeight() {
    var portrait = window.innerHeight >= window.innerWidth;
    var screenH = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
    var h = Math.max(window.innerHeight, document.documentElement.clientHeight, screenH);
    document.documentElement.style.setProperty('--full-h', h + 'px');
  }
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });

  if (location.hash === '#debug') {
    var dbg = document.createElement('div');
    dbg.style.cssText = 'position:absolute;top:60px;left:8px;z-index:9;font:12px monospace;color:#0f0;background:#000a;padding:4px';
    document.body.appendChild(dbg);
    setInterval(function () {
      dbg.textContent = 'inner ' + innerWidth + 'x' + innerHeight + ' | screen ' + screen.width + 'x' + screen.height + ' | doc ' + document.documentElement.clientHeight;
    }, 500);
  }

  setFullHeight();
  window.addEventListener('resize', setFullHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setFullHeight, 250); });

  // Dokununca duraklat / devam et (durum sınıfı olarak tutulur)
  document.body.addEventListener('click', function () {
    document.body.classList.toggle('paused');
  });

  // Oyun çekirdeğini başlat (arayüz henüz yok; kaydırma olayları dinleniyor)
  Game.init(document.getElementById('stage'));

  // Service worker (HTTPS gerekir)
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
<script>
/* Kart: sürükleme, seçim bölgesi ve seçenek animasyonları.
 *  - Kart parmağı birebir takip eder.
 *  - Kart sağ/sol seçim bölgesindeyken bırakılırsa süzülerek çıkar ve seçenek uygulanır.
 *    Parmak kalkmadan hiçbir şey gönderilmez; bölgeden geri çekilirse seçim iptal olur.
 *  - Sürükledikçe arka plan o seçeneğin rengine yumuşakça geçer, seçenek metni belirir.
 *  - Bölgeye girmeden bırakılırsa kart sekmeden merkeze döner.
 * Her karede yalnızca transform / opacity yazılır. */
(function () {
  var stage = document.getElementById('stage'), card = document.getElementById('card');
  var spk = document.getElementById('spk'), txt = document.getElementById('txt');
  var sideL = document.getElementById('sideL'), sideR = document.getElementById('sideR');
  var optL = document.getElementById('optL'), optR = document.getElementById('optR');
  var sideH = document.getElementById('sideH'), optH = document.getElementById('optH');
  var endEl = document.getElementById('end'), endT = document.getElementById('endT');

  var x = 0, y = 0, vx = 0, vy = 0, s = 1, o = 0;        // kartın durumu
  var mode = 'idle';                                       // idle | drag | settle | exit | gap | enter
  var t0 = 0, dir = 0, zone = 105;
  var pl = 0, pr = 0, ph = 0;                              // görünen arka plan ilerlemesi (sol / sağ / gizli)
  var axis = 'x', zoneY = 110, hidAvail = false, hidAt = 'up', nextH = null, hidArmed = false;
  var dragging = false, ox = 0, oy = 0, trail = [];
  var raf = 0, last = 0;
  var pending = null, ended = null, locked = false, nextL = null, nextR = null;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smooth(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }
  function calcZone() { zone = clamp(window.innerWidth * 0.27, 90, 130); zoneY = clamp(window.innerHeight * 0.14, 70, 120); }
  function prog(px) { return smooth((Math.abs(px) - 6) / (zone - 6)); }

  function draw() {
    var r = clamp(x / 280, -1.6, 1.6) * 8;
    card.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + r.toFixed(3) + 'deg) scale(' + s.toFixed(4) + ')';
    card.style.opacity = o.toFixed(3);
    sideL.style.opacity = pl.toFixed(3);
    sideR.style.opacity = pr.toFixed(3);
    var lo = clamp((pl - .15) / .6, 0, 1), ro = clamp((pr - .15) / .6, 0, 1);
    optL.style.opacity = lo.toFixed(3);  optL.style.transform = 'translate3d(' + (-(1 - lo) * 26).toFixed(1) + 'px,0,0)';
    optR.style.opacity = ro.toFixed(3);  optR.style.transform = 'translate3d(' + ((1 - ro) * 26).toFixed(1) + 'px,0,0)';
    sideH.style.opacity = ph.toFixed(3);
    optH.style.opacity = (ph * ph).toFixed(3);               // başta neredeyse görünmez, yaklaştıkça parlar
    optH.style.transform = 'translate3d(0,' + ((hidAt === 'up' ? -1 : 1) * (1 - ph) * 12).toFixed(1) + 'px,0)';
  }

  function applyLabels() {                                 // metin, görünmezken değişir (geçiş sırasında göz yanılmaz)
    if (nextL !== null && pl < .15) { optL.textContent = nextL; nextL = null; }
    if (nextR !== null && pr < .15) { optR.textContent = nextR; nextR = null; }
    if (nextH !== null && ph < .1) { optH.textContent = nextH.label; sideH.className = 'side hid ' + nextH.at; nextH = null; }
  }

  function renderCard(c) {
    spk.textContent = c.speaker || '';
    txt.textContent = c.text || '';
    nextL = c.left ? c.left.label : '';
    nextR = c.right ? c.right.label : '';
    var hd = Game.hiddenOf(c);
    hidAvail = !!hd;
    hidAt = hd && hd.at === 'down' ? 'down' : 'up';
    nextH = hd ? { label: hd.label, at: hidAt } : { label: '', at: hidAt };
    applyLabels();
  }

  function startEnter() {
    x = y = vx = vy = 0; s = .95; o = 0;
    hidArmed = false;
    mode = 'enter'; t0 = performance.now(); locked = true; kick();
  }

  function showEnd() {
    endT.textContent = ended ? ended.text : '';
    endEl.classList.add('show');
  }

  function beginNext() {
    if (pending) {
      var c = pending; pending = null;
      renderCard(c); startEnter();
    } else {
      mode = 'idle';
      if (ended) showEnd();
    }
  }

  function approach(cur, target, dt) {
    var tau = target > cur ? .08 : .11;
    return cur + (target - cur) * (1 - Math.exp(-dt / tau));
  }

  function tick(t) {
    var dt = last ? clamp((t - last) / 1000, .001, .05) : 1 / 60;
    last = t;
    var busy = false, n = 4, h = dt / n, i;

    if (mode === 'drag') {
      busy = true;
    } else if (mode === 'settle') {                         // kritik sönümlü yay: sekmeden merkeze
      var k = 120, c = 2 * Math.sqrt(k);
      for (i = 0; i < n; i++) {
        vx += (-k * x - c * vx) * h; vy += (-k * y - c * vy) * h;
        x += vx * h; y += vy * h;
      }
      if (Math.abs(x) < .1 && Math.abs(y) < .1 && Math.abs(vx) < 2 && Math.abs(vy) < 2) {
        x = y = vx = vy = 0; mode = 'idle';
      } else busy = true;
    } else if (mode === 'exit') {                           // seçim: kart süzülerek çıkar ve silikleşir
      var ke = 70, ce = 2 * Math.sqrt(ke) * .9;
      if (axis === 'x') {
        var far = dir * (window.innerWidth * .5 + card.offsetWidth + 80);
        for (i = 0; i < n; i++) {
          vx += (ke * (far - x) - ce * vx) * h; vy -= vy * 3 * h;
          x += vx * h; y += vy * h;
        }
        o = 1 - smooth((Math.abs(x) - zone) / (window.innerWidth * .5));
      } else {
        var farY = dir * (window.innerHeight * .5 + card.offsetHeight + 80);
        for (i = 0; i < n; i++) {
          vy += (ke * (farY - y) - ce * vy) * h; vx -= vx * 3 * h;
          x += vx * h; y += vy * h;
        }
        o = 1 - smooth((Math.abs(y) - zoneY) / (window.innerHeight * .35));
      }
      if (o <= .01) { o = 0; mode = 'gap'; t0 = t; }
      busy = true;
    } else if (mode === 'gap') {                            // arka plan sakinleşir, sonra yeni kart
      if (t - t0 > 260) beginNext(); else busy = true;
    } else if (mode === 'enter') {
      var kk = clamp((t - t0) / 560, 0, 1), e = 1 - Math.pow(1 - kk, 3);
      o = e; s = .95 + .05 * e; y = 16 * (1 - e);
      if (kk >= 1) { mode = 'idle'; locked = false; o = 1; s = 1; y = 0; } else busy = true;
    }

    var tl = 0, tr = 0, th = 0;                             // arka plan hedefleri
    var live = mode === 'drag' || mode === 'settle';
    if (live || (mode === 'exit' && axis === 'x')) {
      var p = prog(x);
      if (x > 0) tr = p; else tl = p;
    }
    if (hidAvail && (live || (mode === 'exit' && axis === 'y'))) {
      th = smooth(((hidAt === 'up' ? -y : y) - 10) / (zoneY - 10));
    }
    if (mode === 'drag') {                                  // gizli bölgeye girince tek, hafif titreşim
      if (th >= .999 && !hidArmed) { hidArmed = true; if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} } }
      else if (th < .8) hidArmed = false;
    }
    pl = approach(pl, tl, dt); pr = approach(pr, tr, dt); ph = approach(ph, th, dt);
    if (Math.abs(pl - tl) > .002 || Math.abs(pr - tr) > .002 || Math.abs(ph - th) > .002) busy = true;
    else { pl = tl; pr = tr; ph = th; }

    applyLabels();
    draw();
    if (busy) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

  function commit(name, e) {
    dragging = false;
    card.classList.remove('dragging');
    try { card.releasePointerCapture(e.pointerId); } catch (_) {}
    var a = trail[0], b = trail[trail.length - 1], dt = (b.t - a.t) / 1000;
    vx = dt > .01 ? clamp((b.x - a.x) / dt, -1800, 1800) : 0;
    vy = dt > .01 ? clamp((b.y - a.y) / dt, -1800, 1800) : 0;
    if (name === 'hidden') { axis = 'y'; dir = hidAt === 'up' ? -1 : 1; }
    else { axis = 'x'; dir = name === 'right' ? 1 : -1; }
    locked = true; mode = 'exit';
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    Game.choose(name);                                      // seçenek uygulanır; sıradaki kart 'card' olayıyla gelir
    kick();
  }

  card.addEventListener('pointerdown', function (e) {
    e.stopPropagation();                                    // motorun kendi kaydırma girişi devre dışı
    if (locked || !Game.current || (mode !== 'idle' && mode !== 'settle')) return;
    mode = 'drag'; dragging = true;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
    ox = e.clientX - x; oy = e.clientY - y;
    trail = [{ x: e.clientX, y: e.clientY, t: e.timeStamp }];
    kick();
  });

  card.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    x = e.clientX - ox; y = e.clientY - oy;
    trail.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
    while (trail.length > 2 && e.timeStamp - trail[0].t > 80) trail.shift();
  });

  function release(e) {
    if (!dragging) return;
    if (e.type === 'pointerup') {                              // bir seçim bölgesinde bırakıldı: seçenek uygulanır
      var nx = Math.abs(x) / zone;
      var ny = hidAvail ? (hidAt === 'up' ? -y : y) / zoneY : 0;
      if (Math.max(nx, ny) >= 1) {
        commit(ny >= nx ? 'hidden' : (x > 0 ? 'right' : 'left'), e);
        return;
      }
    }
    dragging = false;
    card.classList.remove('dragging');
    try { card.releasePointerCapture(e.pointerId); } catch (_) {}
    var a = trail[0], b = trail[trail.length - 1], dt = (b.t - a.t) / 1000;
    vx = vy = 0;
    if (dt > .01 && e.timeStamp - b.t < 60) {
      vx = clamp((b.x - a.x) / dt, -1800, 1800);
      vy = clamp((b.y - a.y) / dt, -1800, 1800);
    }
    mode = 'settle'; kick();
  }
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);
  card.addEventListener('click', function (e) { e.stopPropagation(); });
  card.addEventListener('dragstart', function (e) { e.preventDefault(); });
  card.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Oyun olayları
  stage.addEventListener('card', function (e) {
    if (mode === 'idle' && !locked) { renderCard(e.detail.card); startEnter(); }
    else pending = e.detail.card;
  });
  stage.addEventListener('end', function (e) {
    ended = e.detail.ending;
    if (mode === 'idle' && !locked) { locked = true; o = 0; draw(); showEnd(); }
  });
  endEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  endEl.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!ended) return;
    ended = null; endEl.classList.remove('show');
    locked = false; mode = 'idle';
    Game.reset();
  });

  window.addEventListener('resize', calcZone);
  calcZone();
  if (Game.state && Game.state.over) { ended = Game.state.ending; locked = true; draw(); showEnd(); }
  else if (Game.current) { renderCard(Game.current); startEnter(); }
  else draw();
})();
</script>
</body>
</html>

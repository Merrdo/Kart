<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Akan Yazı</title>
<!-- viewport-fit=cover: içerik çentik/ada ve ev çubuğu altına kadar uzanır -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akan Yazı">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #000000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Safe area boşluğu YOK: env(safe-area-inset-*) bilerek kullanılmadı */
  html, body {
    width: 100%;
    height: var(--full-h, 100%);
    min-height: 100%;
    background: var(--bg);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* Oyun sahnesi: şimdilik saf siyah, yazı yok. Kartlar buraya gelecek. */
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: var(--full-h, 100%);
    overflow: hidden;
    background: var(--bg);
  }

  /* ---- Kart ---- */
  :root { --cw: min(70vw, 290px); --ch: calc(var(--cw) * 4 / 3); }
  .stage { display: flex; align-items: center; justify-content: center; pointer-events: none; }

  .card {
    position: relative; z-index: 2; pointer-events: auto;
    width: var(--cw); aspect-ratio: 3 / 4;
    padding: 10px;
    display: flex; flex-direction: column;
    border-radius: 24px;
    background: #efeae0;
    transform-origin: 50% 130%;          /* kart elde tutuluyormuş gibi alttan sallanır */
    touch-action: none;
    cursor: grab;
    will-change: transform, opacity;
    opacity: 0;
  }
  .card * { pointer-events: none; }
  .card.dragging { cursor: grabbing; }

  .art { position: relative; flex: 1; overflow: hidden; border-radius: 16px; background: #b5573f; }
  .art i {
    position: absolute; left: 50%; bottom: -24%;
    width: 78%; aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%); background: #c8705a;
  }
  .meta { padding: 14px 10px 8px; font-family: Georgia, 'Times New Roman', serif; color: #2a2520; }
  .spk { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .5; margin-bottom: 7px; }
  .txt { font-size: 16px; line-height: 1.35; }

  /* Seçenekler: arka planın tamamı o tarafın rengine süzülür, seçenek metni kartın üstünde belirir */
  .side { position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none; will-change: opacity; }
  .side.left {
    background:
      radial-gradient(95% 75% at 0% 55%, rgba(84,122,146,.55), rgba(84,122,146,.12) 62%, transparent 100%),
      linear-gradient(90deg, rgba(84,122,146,.16), transparent 75%);
  }
  .side.right {
    background:
      radial-gradient(95% 75% at 100% 55%, rgba(200,108,82,.55), rgba(200,108,82,.12) 62%, transparent 100%),
      linear-gradient(270deg, rgba(200,108,82,.16), transparent 75%);
  }
  .opt {
    position: absolute; left: 26px; right: 26px;
    bottom: calc(50% + var(--ch) / 2 + 28px);
    font: 30px/1.15 Georgia, 'Times New Roman', serif; color: #f1ebe0;
    opacity: 0; will-change: transform, opacity;
  }
  .side.left .opt { text-align: left; }
  .side.right .opt { text-align: right; }

  .end {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 0 32px;
    font-family: Georgia, 'Times New Roman', serif; color: #f1ebe0;
    opacity: 0; transition: opacity .9s ease; pointer-events: none;
  }
  .end.show { opacity: 1; pointer-events: auto; }
  .end p { font-size: 26px; line-height: 1.25; }
  .end small { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .45; }

  /* ---- Kare kart ---- */
  :root { --cw: min(78vw, 340px); --ch: var(--cw); --drop: 56px; }
  .stage { padding-bottom: calc(var(--drop) * 2); }
  .card { aspect-ratio: 1 / 1; padding: 0; background: none; border-radius: 30px; display: block; }
  .art { position:absolute; inset:0; border-radius:30px; background:#1b2127; overflow:hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  .art svg { display:block; width:100%; height:100%; }
  .meta { position:absolute; left:-6px; right:-6px; top:calc(100% + 30px); padding:0; text-align:center; color:#efe9dc; }
  .spk { font-size:11px; letter-spacing:.26em; opacity:.5; margin-bottom:10px; }
  .txt { font-size:18px; line-height:1.4; }
  .opt { bottom: calc(50% + var(--drop) + var(--ch) / 2 + 28px); }
  .deck { position:absolute; left:50%; top:calc(50% - var(--drop)); width:var(--cw); aspect-ratio:1; transform:translate(-50%,-50%); z-index:1; pointer-events:none; }
  .deck i { position:absolute; inset:0; border-radius:30px; background-color:#171c21; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    background-image: linear-gradient(45deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(-45deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 16px 16px; }
  .deck i::after { content:''; position:absolute; inset:14px; border-radius:20px; border:1px solid rgba(255,255,255,.09); }
  .deck i:nth-child(1) { transform:translate(-10px,8px) rotate(-4deg); background-color:#101418; }
  .deck i:nth-child(2) { transform:translate(9px,5px) rotate(3deg); background-color:#13181c; }

  /* ---- v4: sabit üst metin, düzenli deste ---- */
  :root { --drop: 0px; }
  .meta { position:absolute; left:26px; right:26px; top:auto; bottom:calc(50% + var(--drop) + var(--ch) / 2 + 30px); z-index:2; pointer-events:none;
    text-align:center; color:#efe9dc; font-family:Georgia,'Times New Roman',serif; }
  .meta .spk { display:block; font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.5; margin-bottom:10px; }
  .meta .txt { font-size:20px; line-height:1.38; }
  .opt { bottom:auto; top:calc(50% - var(--drop) + var(--ch) / 2 + 58px); }
  .deck i:nth-child(1) { transform:translateY(34px) scale(.88); background-color:#0d1115; }
  .deck i:nth-child(2) { transform:translateY(17px) scale(.94); background-color:#11161a; }
  .deck i:nth-child(3) { transform:none; background-color:#161b20; }

  /* ---- Ana menü ---- */
  .menu {
    position: absolute; top: 0; left: 0; z-index: 10;
    width: 100%; height: var(--full-h, 100%);
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif; color: #efe9dc;
    opacity: 1; visibility: visible;
    transition: opacity .35s ease;
  }
  .menu.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s linear .3s; }
  .menu h1 { font-weight: 400; font-size: clamp(34px, 11vw, 46px); line-height: 1.1; letter-spacing: .06em; padding-left: .06em; }
  .menu .rule { width: 28px; height: 1px; background: #efe9dc; opacity: .25; margin: 26px 0 34px; }
  .menu-btn {
    appearance: none; -webkit-appearance: none; background: none; color: inherit; cursor: pointer;
    font: 12px Georgia, 'Times New Roman', serif; letter-spacing: .32em; text-transform: uppercase;
    padding: 15px 30px 15px 34px; border: 1px solid rgba(239,233,220,.28); border-radius: 999px;
    transition: background .2s ease, border-color .2s ease;
  }
  .menu-btn:active { background: rgba(239,233,220,.08); border-color: rgba(239,233,220,.5); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .menu h1    { animation: rise .8s ease both; }
  .menu .rule { animation: rise .8s ease .12s both; }
  .menu-btn   { animation: rise .8s ease .24s both; }

  /* Oyun içi: sol üstte sönük "Menü" düğmesi (iki dokunuşla çıkış) */
  .exit {
    position: absolute; z-index: 5; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px);
    appearance: none; -webkit-appearance: none; background: none; border: 0; cursor: pointer;
    padding: 12px; font: 11px Georgia, 'Times New Roman', serif; letter-spacing: .26em; text-transform: uppercase;
    color: #efe9dc; opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  body.playing .exit { opacity: .4; pointer-events: auto; }
  body.playing .exit.armed { opacity: .9; }

  /* ---- Kartlar sayfası (ana menüden açılır) ---- */
  .menu-btn + .menu-btn { margin-top: 14px; animation-delay: .34s; }
  .gallery {
    position: absolute; top: 0; left: 0; z-index: 11;
    width: 100%; height: var(--full-h, 100%);
    background: var(--bg); color: #efe9dc;
    display: flex; flex-direction: column;
    font-family: Georgia, 'Times New Roman', serif;
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
  }
  .gallery.open { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  .gal-top { position: relative; flex: none; height: calc(env(safe-area-inset-top, 0px) + 58px); padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 0; }
  .gal-back {
    position: absolute; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px);
    appearance: none; -webkit-appearance: none; background: none; border: 0; cursor: pointer;
    padding: 12px; font: 11px Georgia, 'Times New Roman', serif; letter-spacing: .26em; text-transform: uppercase;
    color: #efe9dc; opacity: .6;
  }
  .gal-back:active { opacity: 1; }
  .gal-title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 8px); text-align: center; line-height: 40px; font-size: 18px; letter-spacing: .12em; pointer-events: none; }
  .gal-list {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 18px; align-content: start;
    padding: 18px 22px calc(env(safe-area-inset-bottom, 0px) + 40px);
  }
  .gal-img { aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #1b2127; box-shadow: 0 14px 30px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06); }
  .gal-img img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .gal-name { margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; opacity: .55; overflow-wrap: anywhere; }
  .gal-empty { grid-column: 1 / -1; text-align: center; opacity: .5; padding-top: 12vh; font-size: 14px; }
</style>

<style>
/* ---- Envanter: çanta ikonuyla açılan panel · iki sayfa: eşyalar / etkiler ---- */
:root{ --cw: min(78vw, 340px, calc(var(--full-h, 844px) * .36)); --iw: calc(var(--cw) * .36); --drop: calc(var(--full-h, 844px) * .06); --ease: cubic-bezier(.22,.85,.3,1); }
.inv{ position:absolute; top:0; left:0; z-index:4; width:100%; height:var(--full-h,100%); display:flex; flex-direction:column; justify-content:flex-end; pointer-events:none;
  opacity:0; transition:opacity .4s ease; }
body.playing .inv:not(.away){ opacity:1; }
.inv-in{
  width:100%;
  opacity:0; transform:translate3d(0,26px,0); visibility:hidden;
  transition:opacity .35s ease, transform .5s var(--ease), visibility 0s linear .5s;
}
body.playing .inv:not(.away).open .inv-in{ opacity:1; transform:none; visibility:visible; transition:opacity .4s ease, transform .55s var(--ease); }

.panes{ display:grid; }
.shelf{
  grid-area:1/1; position:relative; display:flex; gap:12px; overflow-x:auto; overflow-y:hidden; overscroll-behavior:contain; touch-action:pan-x;
  padding:56px 22px 6px; scrollbar-width:none; pointer-events:none; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  transition:opacity .45s ease .1s; will-change:opacity;
}
.shelf::-webkit-scrollbar{ display:none; }
.shelf.many{ -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); }
.inv.open .shelf:not(.off){ pointer-events:auto; }
.shelf.off{ opacity:0; transition-duration:.28s; transition-delay:0s; }
.shelf.empty::before{ content:attr(data-empty); position:absolute; left:0; right:0; top:calc(56px + var(--iw) / 2 - 9px); text-align:center;
  font:italic 14px/1.3 Georgia,'Times New Roman',serif; letter-spacing:.08em; color:#efe9dc; opacity:.35; }

/* Katman 1 .ic: yerleşim + snap | 2 .lift: kaydırmaya bağlı yelpaze | 3 .sel: seçim hareketi | 4 .face: çizim */
.ic{ flex:none; width:var(--iw); aspect-ratio:1; padding:0; border:0; background:none; cursor:pointer; position:relative;
  scroll-snap-align:center; -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; }
.lift{ position:absolute; inset:0; transform-origin:50% 100%; will-change:transform,opacity; }
.shelf.ease .lift{ transition:transform .5s var(--ease), opacity .5s ease; }
.sel{ position:absolute; inset:0; transform-origin:50% 100%; will-change:transform; transition:transform .55s var(--ease), opacity .35s ease; }
.ic:active:not(.on) .sel{ transform:translateY(-6px) scale(1.03); transition-duration:.18s; }
.shelf.pick .ic:not(.on) .sel{ transform:scale(.95); }
.ic.on .sel{ transform:translateY(-28px) scale(1.12); }
.ic.gone .sel{ opacity:0; transform:scale(.6); }
.ic .face{ position:absolute; inset:0; border-radius:calc(var(--iw) * .15); overflow:hidden; background:#1b2127;
  box-shadow:0 8px 18px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.07); }
.ic .face svg{ display:block; width:100%; height:100%; pointer-events:none; }
.ic .face::after{ content:""; position:absolute; inset:0; background:#000; opacity:0; transition:opacity .4s ease; }
.shelf.pick .ic:not(.on) .face::after{ opacity:.5; }
.ic .halo{ position:absolute; inset:0; border-radius:calc(var(--iw) * .15); pointer-events:none; opacity:0; transition:opacity .45s ease;
  box-shadow:0 20px 28px rgba(0,0,0,.8), 0 0 0 1.5px var(--ring,rgba(239,233,220,.9)), 0 0 24px var(--glow,rgba(239,233,220,.22)); }
.ic.on .halo{ opacity:1; }
.ic:focus-visible{ outline:2px solid #efe9dc; outline-offset:4px; }

/* Alt yazı: çapraz geçiş + akıcı genişlik */
.inv-cap{ display:flex; align-items:center; justify-content:center; gap:14px; height:34px; box-sizing:border-box; padding:6px 20px; width:max-content; margin:2px auto calc(env(safe-area-inset-bottom,0px) + 10px); -webkit-tap-highlight-color:transparent;
  font:italic 14px/1 Georgia,'Times New Roman',serif; letter-spacing:.08em; color:#efe9dc; opacity:.4; transition:opacity .4s ease, color .4s ease; }
.inv-cap::before,.inv-cap::after{ content:""; width:34px; height:1px; background:currentColor; opacity:.5; }
.inv-cap.has{ opacity:.9; }
.cap-slot{ position:relative; height:22px; width:70px; transition:width .55s var(--ease); }
.cap-slot span{ position:absolute; left:50%; top:0; line-height:22px; white-space:nowrap; opacity:0; transform:translate3d(-50%,7px,0); transition:opacity .32s ease, transform .5s var(--ease); }
.cap-slot span.in{ opacity:1; transform:translate3d(-50%,0,0); }
.cap-slot span.out{ opacity:0; transform:translate3d(-50%,-7px,0); }

/* Sekmeler: eşyalar | etkiler, altında kayan çizgi */
.inv.open .tabs{ pointer-events:auto; }
body.playing .inv:not(.away) .inv-cap{ pointer-events:auto; cursor:pointer; }
.inv-cap.dot{ opacity:1; color:#d8b45c; }
.inv-cap.dot .cap-slot span.in, .tabs button.dot{
  background:linear-gradient(100deg,#b8923a 0%,#d8b45c 30%,#fff1c4 48%,#d8b45c 66%,#b8923a 100%) 100% 0/260% 100% no-repeat;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  animation:goldSweep 2.8s cubic-bezier(.45,0,.25,1) infinite, goldGlow 2.8s ease-in-out infinite; }
@keyframes goldSweep{ 0%{ background-position:100% 0; } 70%,100%{ background-position:0% 0; } }
@keyframes goldGlow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(216,180,92,0)); } 40%{ filter:drop-shadow(0 0 5px rgba(216,180,92,.45)); } }
.tabs{ position:relative; display:flex; justify-content:center; gap:30px; margin:12px auto 0; width:max-content; }
.tabs button{ position:relative; appearance:none; -webkit-appearance:none; background:none; border:0; padding:6px 2px 8px; cursor:pointer; color:#efe9dc; opacity:.38;
  font:10.5px/1 Georgia,'Times New Roman',serif; letter-spacing:.3em; text-transform:uppercase; transition:opacity .35s ease; -webkit-tap-highlight-color:transparent; }
.tabs button.on{ opacity:.9; }
.tabs sup{ font-size:9px; letter-spacing:0; margin-left:5px; opacity:.6; vertical-align:top; }
.tabs button.dot{ opacity:1; }
.tab-ink{ position:absolute; left:0; bottom:0; height:1px; width:0; background:#efe9dc; opacity:.7; transition:transform .5s var(--ease), width .5s var(--ease); }

@keyframes deal{ from{ opacity:0; transform:translateY(60px) scale(.9); } }
.inv.open .ic{ animation:deal .7s var(--ease) backwards; }
.inv.open .ic:nth-child(2){ animation-delay:.08s; } .inv.open .ic:nth-child(3){ animation-delay:.16s; } .inv.open .ic:nth-child(4){ animation-delay:.24s; }
@media (prefers-reduced-motion:reduce){ .inv-cap.dot .cap-slot span.in, .tabs button.dot{ animation:none !important; background-position:50% 0; } }
@media (prefers-reduced-motion:reduce){ .sel,.lift,.shelf,.inv-in,.cap-slot,.cap-slot span,.tab-ink,.bag{ transition:none !important; } .ic{ animation:none !important; } }
</style>
</head>

  <div class="card" id="card">
    <div class="art"><svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

      </div>

</div>


<div class="inv" id="inv">
  <div class="inv-in">
    <div class="panes">
      <div class="shelf" id="shelf" data-empty="henüz eşya yok"></div>
      <div class="shelf fxp off" id="fxShelf" data-empty="üzerinde etki yok"></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" class="on" data-t="items">eşyalar<sup id="nI"></sup></button>
      <button type="button" data-t="fx">etkiler<sup id="nF"></sup></button>
      <i class="tab-ink" id="ink"></i>
    </div>
  </div>
  <div class="inv-cap" id="invCap"><div class="cap-slot" id="capSlot"><span class="in">envanter</span><span></span></div></div>
</div>

<script>
/* Kart verisi — hikaye burada yazılır, motor (game.js) bunu okur.
 *
 * Kart şeması:
 * {
 *   id:       benzersiz anahtar
 *   speaker:  konuşan karakter
 *   text:     kartın metni
 *   left / right: {                      // sola / sağa kaydırma seçimi
 *     label:   seçim etiketi
 *     effects: { faith, people, army, wealth }   // + / - değişim
 *     set:     ['bayrak', ...]           // hikaye bayrakları koy
 *     unset:   ['bayrak', ...]           // hikaye bayraklarını kaldır
 *     next:    ['kartId', ...]           // sıradaki kartları zincirle
 *   }
 *   requires: { flags:[], notFlags:[], stat:{ army:{min:30,max:80} }, minTurn:0 }
 *   weight:   çekilme ağırlığı (varsayılan 1)
 *   once:     true ise bir kez çıkar
 * }
 */
window.CARDS = [
  { id:'q1', speaker:'Uğultu', clarity:0.04, text:'…uyan… Beni du…yu…yor musun? Gözlerini aç.',
    left:  { label:'Sus', effects:{}, next: ['q2'] },

  { id:'q4', speaker:'Bir erkek sesi', clarity:0.5, text:'Yanındaki adam kimdi? Bana onu anlat.',

  { id:'q5', speaker:'Bir gölge', clarity:0.7, text:'Bir şey saklıyorsun. Gözlerinden belli.',
    left:  { label:'Saklamıyorum', effects:{}, next: ['q6'] },
    right: { label:'Saklıyorum', effects:{}, next: ['q6'] } },
  { id:'q6', speaker:'???', clarity:0.88, text:'Bana bak. Şimdi söyle: beni tanıdın mı?',
    left:  { label:'Hayır', effects:{}, next: ['q7'] },
    right: { label:'Belki', effects:{}, next: ['q7'] } },
  { id:'q7', speaker:'???', clarity:1, text:'Işık kısılıyor. Yarın devam ederiz.',
    left:  { label:'…', effects:{}, set:['sorguBitti'], next:['f1'] },
    right: { label:'…', effects:{}, set:['sorguBitti'], next:['f1'] } },

  /* Arkadaş: sorgudan sonra, dışarıda, gün ışığında. art:'friend' kartın görselini değiştirir. */

/* Oyun sonları: bir istatistik 0'a ya da 100'e değince tetiklenir. */
window.ENDINGS = {
  faith:  { low: { id: 'end_faith_low',  text: 'İnancın söndü.' },
            high: { id: 'end_faith_high', text: 'Din, tahtı yuttu.' } },
  people: { low: { id: 'end_people_low',  text: 'Halk ayaklandı.' },
            high: { id: 'end_people_high', text: 'Halk seni tahttan indirdi.' } },
  army:   { low: { id: 'end_army_low',  text: 'Ordu dağıldı.' },
            high: { id: 'end_army_high', text: 'Generaller darbe yaptı.' } },
  wealth: { low: { id: 'end_wealth_low',  text: 'Hazine boşaldı.' },
            high: { id: 'end_wealth_high', text: 'Servet, seni yozlaştırdı.' } }
};

/* Oyun çekirdeği (Reigns tarzı): durum, deste, seçim, son kontrolü, kaydırma girişi.
 * Arayüz yok — ileride render katmanı Game olaylarını dinleyerek kartı çizecek.
 *
 * Olaylar (stage üzerinde CustomEvent):
 *   'card'   → { card }                 yeni kart çekildi
 *   'choice' → { card, dir, result }    seçim yapıldı
 *   'end'    → { ending }               oyun bitti
 *   'swipe'  → { dir, dx }              ham kaydırma (left | right)
 *   'drag'   → { dx, ratio }            sürükleme sırasında (-1..1)
 */
(function () {
  var STATS = ['faith', 'people', 'army', 'wealth'];
  var SAVE_KEY = 'akan-yazi-save-v2';
  var SWIPE_MIN = 60; // px

  var Game = {
    el: null,
    state: null,
    current: null,

    init: function (el) {
      this.el = el;
      this.state = this.fresh();   // her oyun ana menüden baştan başlar; kayıttan devam yok
      this.bindInput();
    },

    fresh: function () {
      var s = { turn: 0, stats: {}, flags: {}, seen: {}, queue: [], over: false, ending: null };
      STATS.forEach(function (k) { s.stats[k] = 50; });
      return s;
    },

    reset: function () {
      this.state = this.fresh();
      this.save();
      this.draw();
    },

    // --- Deste -------------------------------------------------------------
    // Koşul kontrolü 
    meets: function (r) {
      var s = this.state; r = r || {};
      if (r.minTurn && s.turn < r.minTurn) return false;
      if (r.flags && !r.flags.every(function (f) { return s.flags[f]; })) return false;
      if (r.notFlags && r.notFlags.some(function (f) { return s.flags[f]; })) return false;
      if (r.stat) {
        for (var k in r.stat) {
          var v = s.stats[k], c = r.stat[k];
          if (c.min != null && v < c.min) return false;
          if (c.max != null && v > c.max) return false;
        }
      }
      return true;
    },

    eligible: function (card) {
      if (card.once && this.state.seen[card.id]) return false;
      return this.meets(card.requires);
    },

    byId: function (id) {
      return window.CARDS.filter(function (c) { return c.id === id; })[0] || null;
    },

    pick: function () {
      var s = this.state, card = null;
      while (s.queue.length && !card) {          // zincirlenen kartlar önce
        var q = this.byId(s.queue.shift());
        if (q && this.eligible(q)) card = q;
      }
      if (card) return card;
      var pool = window.CARDS.filter(this.eligible, this);
      if (!pool.length) return null;
      var total = pool.reduce(function (a, c) { return a + (c.weight || 1); }, 0);
      var roll = Math.random() * total;
      for (var i = 0; i < pool.length; i++) {
        roll -= (pool[i].weight || 1);
        if (roll <= 0) return pool[i];
      }
      return pool[pool.length - 1];
    },

    draw: function () {
      this.current = this.pick();
      if (this.current) this.emit('card', { card: this.current });
      return this.current;
    },

    // --- Seçim -------------------------------------------------------------
    choose: function (dir) {
      if (this.state.over || !this.current) return null;
      var card = this.current, opt = card[dir];
      if (!opt) return null;
      var s = this.state;

      var e = opt.effects || {};
      STATS.forEach(function (k) {
        if (e[k]) s.stats[k] = Math.max(0, Math.min(100, s.stats[k] + e[k]));
      });
      (opt.set || []).forEach(function (f) { s.flags[f] = true; });
      (opt.unset || []).forEach(function (f) { delete s.flags[f]; });
      (opt.next || []).forEach(function (id) { s.queue.push(id); });
      s.seen[card.id] = true;
      s.turn++;

      var ending = this.checkEnd();
      var result = { stats: JSON.parse(JSON.stringify(s.stats)), ending: ending };
      this.emit('choice', { card: card, dir: dir, result: result });

      if (ending) {
        s.over = true; s.ending = ending;
        this.current = null;
        this.save();
        this.emit('end', { ending: ending });
      } else {
        this.save();
        this.draw();
      }
      return result;
    },

    checkEnd: function () {
      var s = this.state;
      for (var i = 0; i < STATS.length; i++) {
        var k = STATS[i], v = s.stats[k];
        if (v <= 0) return window.ENDINGS[k].low;
        if (v >= 100) return window.ENDINGS[k].high;
      }
      return null;
    },

    // --- Kayıt -------------------------------------------------------------
    save: function () {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.state)); } catch (e) {}
    },
    load: function () {
      try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
    },

    // --- Giriş: sola / sağa kaydırma --------------------------------------
    bindInput: function () {
      var self = this, el = this.el, x0 = null, dx = 0;
      window.__swiped = false;

      el.addEventListener('pointerdown', function (e) {
        x0 = e.clientX; dx = 0; window.__swiped = false;
      });
      el.addEventListener('pointermove', function (e) {
        if (x0 === null) return;
        dx = e.clientX - x0;
        self.emit('drag', { dx: dx, ratio: Math.max(-1, Math.min(1, dx / (window.innerWidth / 2))) });
      });
      function up() {
        if (x0 === null) return;
        if (Math.abs(dx) >= SWIPE_MIN) {
          var dir = dx < 0 ? 'left' : 'right';
          window.__swiped = true;
          self.emit('swipe', { dir: dir, dx: dx });
          self.choose(dir);
        }
        x0 = null; dx = 0;
        self.emit('drag', { dx: 0, ratio: 0 });
      }
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      // Klavye (test için)
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') self.choose('left');
        if (e.key === 'ArrowRight') self.choose('right');
      });
    },

    emit: function (name, detail) {
      this.el.dispatchEvent(new CustomEvent(name, { detail: detail }));
    }
  };

  window.Game = Game;
})();
</script>
<script>
(function () {
  function setFullHeight() {
    var portrait = window.innerHeight >= window.innerWidth;
    var screenH = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
    var h = Math.max(window.innerHeight, document.documentElement.clientHeight, screenH);
    document.documentElement.style.setProperty('--full-h', h + 'px');
  }
  document.addEventListener('touchmove', function (e) {
    if (e.target.closest && e.target.closest('.gal-list, .shelf')) return;   // Kartlar sayfası kaydırılabilsin
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });

  if (location.hash === '#debug') {
    var dbg = document.createElement('div');
    dbg.style.cssText = 'position:absolute;top:60px;left:8px;z-index:9;font:12px monospace;color:#0f0;background:#000a;padding:4px';
    document.body.appendChild(dbg);
    setInterval(function () {
      dbg.textContent = 'inner ' + innerWidth + 'x' + innerHeight + ' | screen ' + screen.width + 'x' + screen.height + ' | doc ' + document.documentElement.clientHeight;
    }, 500);
  }

  setFullHeight();
  window.addEventListener('resize', setFullHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setFullHeight, 250); });

  // Dokununca duraklat / devam et (durum sınıfı olarak tutulur)
  document.body.addEventListener('click', function () {
    document.body.classList.toggle('paused');
  });

  // Oyun çekirdeğini başlat (oyun menüden "Başla" ile açılır)
  Game.init(document.getElementById('stage'));

  // Ana menü: Başla → oyun baştan başlar. Menü → (iki dokunuş) oyundan çıkılır, ilerleme silinir.
  var menu = document.getElementById('menu');
  var playBtn = document.getElementById('playBtn');
  var exitBtn = document.getElementById('exitBtn');
  var busy = false, armTimer = 0;

  function disarm() {
    clearTimeout(armTimer);
    exitBtn.classList.remove('armed');
    exitBtn.textContent = 'Menü';
  }

  function startGame() {
    if (busy) return;
    busy = true;
    menu.classList.add('hidden');
    setTimeout(function () {
      GameUI.reset();            // arayüz durumunu sıfırla
      Game.reset();              // yeni oyun: ilk kart gelir
      document.body.classList.add('playing');
      busy = false;
    }, 320);
  }

  function exitToMenu() {
    if (busy) return;
    busy = true;
    disarm();
    document.body.classList.remove('playing');
    menu.classList.remove('hidden');
    setTimeout(function () {     // menü tamamen örtülünce oyunu temizle
      Game.current = null;
      Game.state = Game.fresh();
      GameUI.reset();
      busy = false;
    }, 380);
  }

  playBtn.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
  exitBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (exitBtn.classList.contains('armed')) { exitToMenu(); return; }
    exitBtn.classList.add('armed');
    exitBtn.textContent = 'Çıkılsın mı?';
    armTimer = setTimeout(disarm, 2200);
  });

  // Service worker (HTTPS gerekir)
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>

ART.kelepce = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="400" fill="#2b1618"/><circle cx="200" cy="208" r="168" fill="#3a1d20"/><g fill="none" stroke-width="9"><rect x="160" y="193" width="46" height="28" rx="14" stroke="#8d969e"/><rect x="194" y="193" width="46" height="28" rx="14" stroke="#aab2b9"/></g><g fill="none"><circle cx="112" cy="210" r="62" stroke="#c4cbd1" stroke-width="22"/><circle cx="112" cy="210" r="50" stroke="#6d757c" stroke-width="3"/><path d="M70 176A52 52 0 0 1 120 150" stroke="#f2f5f7" stroke-width="5" stroke-linecap="round" opacity=".65"/><circle cx="288" cy="210" r="62" stroke="#c4cbd1" stroke-width="22"/><circle cx="288" cy="210" r="50" stroke="#6d757c" stroke-width="3"/><path d="M246 176A52 52 0 0 1 296 150" stroke="#f2f5f7" stroke-width="5" stroke-linecap="round" opacity=".65"/></g><rect x="84" y="128" width="56" height="36" rx="9" fill="#8b949b"/><rect x="260" y="128" width="56" height="36" rx="9" fill="#8b949b"/><circle cx="112" cy="146" r="6" fill="#23282c"/><circle cx="288" cy="146" r="6" fill="#23282c"/><rect x="0" y="352" width="400" height="48" fill="#1f1012"/></svg>';
window.Scene = {
  render: function (c, spk, txt) {
    var art = document.querySelector('.art');
    if (ART.hat === null) ART.hat = art.innerHTML;            // ilk (şapkalı adam) görseli sakla
    var want = c.art && ART[c.art] ? c.art : 'hat';
    if (art.getAttribute('data-art') !== want) { art.innerHTML = ART[want]; art.setAttribute('data-art', want); }
    spk.textContent = c.speaker || '';
    txt.textContent = c.text || '';
  }

<script>
/* Kart: sürükleme, seçim bölgesi ve seçenek animasyonları.
 *  - Kart parmağı birebir takip eder.
 *  - Kart sağ/sol seçim bölgesindeyken bırakılırsa süzülerek çıkar ve seçenek uygulanır.
 *    Parmak kalkmadan hiçbir şey gönderilmez; bölgeden geri çekilirse seçim iptal olur.
 *  - Sürükledikçe arka plan o seçeneğin rengine yumuşakça geçer, seçenek metni belirir.
 *  - Bölgeye girmeden bırakılırsa kart sekmeden merkeze döner.
 * Her karede yalnızca transform / opacity yazılır. */
(function () {
  var stage = document.getElementById('stage'), card = document.getElementById('card');
  var spk = document.getElementById('spk'), txt = document.getElementById('txt');
  var sideL = document.getElementById('sideL'), sideR = document.getElementById('sideR');
  var optL = document.getElementById('optL'), optR = document.getElementById('optR');
  var endEl = document.getElementById('end'), endT = document.getElementById('endT');

  var x = 0, y = 0, vx = 0, vy = 0, s = 1, o = 0;        // kartın durumu
  var mode = 'idle';                                       // idle | drag | settle | exit | gap | enter
  var t0 = 0, dir = 0, zone = 105;
  var pl = 0, pr = 0;                                      // görünen arka plan ilerlemesi (sol / sağ)
  var dragging = false, ox = 0, oy = 0, trail = [];
  var raf = 0, last = 0;
  var pending = null, ended = null, locked = false, nextL = null, nextR = null;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smooth(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }
  function calcZone() { zone = clamp(window.innerWidth * 0.27, 90, 130); }
  function prog(px) { return smooth((Math.abs(px) - 6) / (zone - 6)); }

  function draw() {
    var r = clamp(x / 280, -1.6, 1.6) * 8;
    card.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + r.toFixed(3) + 'deg) scale(' + s.toFixed(4) + ')';
    card.style.opacity = o.toFixed(3);
    sideL.style.opacity = pl.toFixed(3);
    sideR.style.opacity = pr.toFixed(3);
    var lo = clamp((pl - .15) / .6, 0, 1), ro = clamp((pr - .15) / .6, 0, 1);
    optL.style.opacity = lo.toFixed(3);  optL.style.transform = 'translate3d(' + (-(1 - lo) * 26).toFixed(1) + 'px,0,0)';
    optR.style.opacity = ro.toFixed(3);  optR.style.transform = 'translate3d(' + ((1 - ro) * 26).toFixed(1) + 'px,0,0)';
  }

  function applyLabels() {                                 // metin, görünmezken değişir (geçiş sırasında göz yanılmaz)
    if (nextL !== null && pl < .15) { optL.textContent = nextL; nextL = null; }
    if (nextR !== null && pr < .15) { optR.textContent = nextR; nextR = null; }
  }

  function renderCard(c) {
    Scene.render(c, spk, txt);
    nextL = c.left ? c.left.label : '';
    nextR = c.right ? c.right.label : '';
    applyLabels();
  }

  function startEnter() {
    x = y = vx = vy = 0; s = .95; o = 0;
    mode = 'enter'; t0 = performance.now(); locked = true; kick();
  }

  function showEnd() {
    endT.textContent = ended ? ended.text : '';
    endEl.classList.add('show'); document.getElementById('meta').style.opacity = 0;
  }

  function beginNext() {
    if (pending) {
      var c = pending; pending = null;
      renderCard(c); startEnter();
    } else {
      mode = 'idle';
      if (ended) showEnd();
    }
  }

  function approach(cur, target, dt) {
    var tau = target > cur ? .08 : .11;
    return cur + (target - cur) * (1 - Math.exp(-dt / tau));
  }

  function tick(t) {
    var dt = last ? clamp((t - last) / 1000, .001, .05) : 1 / 60;
    last = t;
    var busy = false, n = 4, h = dt / n, i;

    if (mode === 'drag') {
      busy = true;
    } else if (mode === 'settle') {                         // kritik sönümlü yay: sekmeden merkeze
      var k = 120, c = 2 * Math.sqrt(k);
      for (i = 0; i < n; i++) {
        vx += (-k * x - c * vx) * h; vy += (-k * y - c * vy) * h;
        x += vx * h; y += vy * h;
      }
      if (Math.abs(x) < .1 && Math.abs(y) < .1 && Math.abs(vx) < 2 && Math.abs(vy) < 2) {
        x = y = vx = vy = 0; mode = 'idle';
      } else busy = true;
    } else if (mode === 'exit') {                           // seçim: kart süzülerek çıkar ve silikleşir
      var ke = 70, ce = 2 * Math.sqrt(ke) * .9;
      var far = dir * (window.innerWidth * .5 + card.offsetWidth + 80);
      for (i = 0; i < n; i++) {
        vx += (ke * (far - x) - ce * vx) * h; vy -= vy * 3 * h;
        x += vx * h; y += vy * h;
      }
      o = 1 - smooth((Math.abs(x) - zone) / (window.innerWidth * .5));
      if (o <= .01) { o = 0; mode = 'gap'; t0 = t; }
      busy = true;
    } else if (mode === 'gap') {                            // arka plan sakinleşir, sonra yeni kart
      if (t - t0 > 260) beginNext(); else busy = true;
    } else if (mode === 'enter') {
      var kk = clamp((t - t0) / 560, 0, 1), e = 1 - Math.pow(1 - kk, 3);
      o = e; s = .95 + .05 * e; y = 16 * (1 - e);
      if (kk >= 1) { mode = 'idle'; locked = false; o = 1; s = 1; y = 0; } else busy = true;
    }

    var tl = 0, tr = 0;                             // arka plan hedefleri
    var live = mode === 'drag' || mode === 'settle';
    if (live || mode === 'exit') {
      var p = prog(x);
      if (x > 0) tr = p; else tl = p;
    }
    pl = approach(pl, tl, dt); pr = approach(pr, tr, dt);
    if (Math.abs(pl - tl) > .002 || Math.abs(pr - tr) > .002) busy = true;
    else { pl = tl; pr = tr; }

    applyLabels();
    draw();
    if (busy) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

  function commit(name, e) {
    dragging = false;
    card.classList.remove('dragging');
    try { card.releasePointerCapture(e.pointerId); } catch (_) {}
    var a = trail[0], b = trail[trail.length - 1], dt = (b.t - a.t) / 1000;
    vx = dt > .01 ? clamp((b.x - a.x) / dt, -1800, 1800) : 0;
    vy = dt > .01 ? clamp((b.y - a.y) / dt, -1800, 1800) : 0;
    dir = name === 'right' ? 1 : -1;
    locked = true; mode = 'exit';
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    Game.choose(name);                                      // seçenek uygulanır; sıradaki kart 'card' olayıyla gelir
    kick();
  }

  card.addEventListener('pointerdown', function (e) {
    e.stopPropagation();                                    // motorun kendi kaydırma girişi devre dışı
    if (locked || !Game.current || (mode !== 'idle' && mode !== 'settle')) return;
    mode = 'drag'; dragging = true;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
    ox = e.clientX - x; oy = e.clientY - y;
    trail = [{ x: e.clientX, y: e.clientY, t: e.timeStamp }];
    kick();
  });

  card.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    x = e.clientX - ox; y = e.clientY - oy;
    trail.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
    while (trail.length > 2 && e.timeStamp - trail[0].t > 80) trail.shift();
  });

  function release(e) {
    if (!dragging) return;
    if (e.type === 'pointerup') {                              // bir seçim bölgesinde bırakıldı: seçenek uygulanır
      if (Math.abs(x) >= zone) {
        commit(x > 0 ? 'right' : 'left', e);
        return;
      }
    }
    dragging = false;
    card.classList.remove('dragging');
    try { card.releasePointerCapture(e.pointerId); } catch (_) {}
    var a = trail[0], b = trail[trail.length - 1], dt = (b.t - a.t) / 1000;
    vx = vy = 0;
    if (dt > .01 && e.timeStamp - b.t < 60) {
      vx = clamp((b.x - a.x) / dt, -1800, 1800);
      vy = clamp((b.y - a.y) / dt, -1800, 1800);
    }
    mode = 'settle'; kick();
  }
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);
  card.addEventListener('click', function (e) { e.stopPropagation(); });
  card.addEventListener('dragstart', function (e) { e.preventDefault(); });
  card.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Oyun olayları
  stage.addEventListener('card', function (e) {
    if (mode === 'idle' && !locked) { renderCard(e.detail.card); startEnter(); }
    else pending = e.detail.card;
  });
  stage.addEventListener('end', function (e) {
    ended = e.detail.ending;
    if (mode === 'idle' && !locked) { locked = true; o = 0; draw(); showEnd(); }
  });
  endEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  endEl.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!ended) return;
    ended = null; endEl.classList.remove('show');
    locked = false; mode = 'idle';
    Game.reset();
  });

  // Menüye çıkıldığında / yeni oyun başlarken arayüzü tamamen sıfırlar
  function resetUI() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    last = 0;
    x = y = vx = vy = 0; s = 1; o = 0; pl = pr = 0;
    mode = 'idle'; locked = false; dragging = false;
    pending = null; ended = null; nextL = null; nextR = null;
    optL.textContent = ''; optR.textContent = '';
    card.classList.remove('dragging');
    endEl.classList.remove('show');
    document.getElementById('meta').style.opacity = '';
    draw();
  }
  window.GameUI = { reset: resetUI };

  window.addEventListener('resize', calcZone);
  calcZone();
  if (Game.state && Game.state.over) { ended = Game.state.ending; locked = true; draw(); showEnd(); }
  else if (Game.current) { renderCard(Game.current); startEnter(); }
  else draw();
})();
</script>
<script>
/* Kartlar sayfası: oyundaki tüm kart çizimlerini isimleriyle listeler. */
(function () {
  var gal = document.getElementById('gallery'), list = document.getElementById('galList');
  if (ART.hat === null) { var a0 = document.querySelector('.art'); if (a0) ART.hat = a0.innerHTML; }   // ilk çizim sayfadaki hâliyle saklanır

  function url(svg) {
    if (!/<svg[^>]*\sxmlns=/i.test(svg)) svg = svg.replace(/<svg\b/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function build() {
    var keys = Object.keys(ART).filter(function (k) { return typeof ART[k] === 'string' && ART[k]; });
    list.innerHTML = keys.length ? keys.map(function (k) {
      return '<div class="gal-item"><div class="gal-img"><img alt="" draggable="false" src="' + url(ART[k]) + '"></div><div class="gal-name">' + esc((window.ART_NAMES && ART_NAMES[k]) || k) + '</div></div>';
    }).join('') : '<div class="gal-empty">Henüz kart yok</div>';
    list.scrollTop = 0;
  }
  function open()  { build(); gal.classList.add('open');  gal.setAttribute('aria-hidden', 'false'); }
  function close() { gal.classList.remove('open'); gal.setAttribute('aria-hidden', 'true'); }

  document.getElementById('cardsBtn').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  document.getElementById('galBack').addEventListener('click', function (e) { e.stopPropagation(); close(); });
  gal.addEventListener('click', function (e) { e.stopPropagation(); });
})();
</script>

<script>
/* Envanter: çanta düğmesiyle açılır/kapanır. İki sayfa: eşyalar ve etkiler (ikisi de kaydırmalı yelpaze).
 *  Inventory.add('id') / Inventory.held / stage 'hold' olayı { id }
 *  Inventory.addEffect('id') / removeEffect('id')  ·  hikâyede bayrak: opt.set:['kelepce'] / unset:['kelepce']
 *  Inventory.toggle() / open() / close()  ·  Çizimler ART[id], adlar ART_NAMES[id] */
(function () {
  var stage = document.getElementById('stage'), inv = document.getElementById('inv');
  var cap = document.getElementById('invCap'), slot = document.getElementById('capSlot');
  var tabs = document.getElementById('tabs'), ink = document.getElementById('ink');
  var GAP = 12, SIDE = 22;

  /* ---- DENEME İÇERİĞİ (geçici): mevcut çizimleri kopyalar. Kaldırmak için DEMO = {} yap, items'tan demoA/B/C'yi sil. ---- */
  var DEMO = {
    demoA: { src: 'friend', name: 'Arkadaş 2' }, demoB: { src: 'hat', name: 'Şapkalı adam 2' }, demoC: { src: 'friend', name: 'Arkadaş 3' },
    demoE1: { src: 'kelepce', name: 'Kelepçe' }, demoE2: { src: 'friend', name: 'Yorgunluk' }, demoE3: { src: 'hat', name: 'Korku' }
  };
  var demoEffects = ['demoE1', 'demoE2', 'demoE3'];
  function nm(id) { return DEMO[id] ? DEMO[id].name : ((window.ART_NAMES && ART_NAMES[id]) || id); }
  function svgFor(id) {                       // aynı çizim sayfada birden çok kez olacağı için id çakışmasın
    var s = (window.ART && ART[DEMO[id] ? DEMO[id].src : id]) || '', p = 'i_' + id + '_';
    return s.replace(/id="([^"]+)"/g, 'id="' + p + '$1"').replace(/url\(#([^)]+)\)/g, 'url(#' + p + '$1)');
  }

  /* ---- Alt yazı ---- */
  var spans = slot.children, cur = 0, shown = 'envanter';
  function fitSlot() { slot.style.width = spans[cur].offsetWidth + 'px'; }
  function say(t, on, isFx) {
    cap.classList.toggle('has', !!on); cap.classList.toggle('fxcap', !!isFx);
    if (t === shown) return;
    shown = t;
    var old = spans[cur]; cur = 1 - cur; var n = spans[cur];
    n.style.transition = 'none'; n.className = ''; n.textContent = t; void n.offsetWidth; n.style.transition = '';
    old.className = 'out'; n.className = 'in';
    fitSlot();
  }

  /* ---- Kaydırmalı yelpaze (her sayfa için bir tane) ---- */
  function Carousel(el) {
    var c = { el: el, ids: [], held: null }, pitch = 120, tick = 0, easeT = 0;
    c.make = function (id) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ic'; b.setAttribute('data-id', id);
      b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', nm(id));
      b.innerHTML = '<div class="lift"><div class="sel"><div class="face">' + svgFor(id) + '</div><div class="halo"></div></div></div>';
      return b;
    };
    c.layout = function () {
      var kids = el.children, n = kids.length;
      el.classList.toggle('empty', !n);
      if (!n) { el.classList.remove('many'); return; }
      var W = el.clientWidth, iw = kids[0].offsetWidth; pitch = iw + GAP;
      var total = n * pitch - GAP, fits = total <= W - SIDE * 2;
      var pad = Math.max(SIDE, (W - (fits ? total : iw)) / 2);
      el.style.paddingLeft = el.style.paddingRight = pad + 'px';
      el.classList.toggle('many', !fits);
      [].forEach.call(kids, function (k) { k._c = k.offsetLeft + iw / 2; });
    };
    c.update = function () {                  // merkeze uzaklığa göre ölçek / eğim / saydamlık
      var m = el.scrollLeft + el.clientWidth / 2;
      [].forEach.call(el.children, function (k) {
        var d = (k._c - m) / pitch, a = Math.min(Math.abs(d), 2.2);
        var r = Math.max(-6, Math.min(6, d * 3)), sc = 1 - .07 * a, o = 1 - .4 * Math.max(0, a - 1), l = k.firstChild;
        l.style.transform = 'translate3d(0,' + (a * 5).toFixed(2) + 'px,0) rotate(' + r.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
        l.style.opacity = o.toFixed(3);
      });
    };
    c.soft = function () {
      el.classList.add('ease'); c.layout(); c.update();
      clearTimeout(easeT); easeT = setTimeout(function () { el.classList.remove('ease'); }, 600);
    };
    c.center = function (k, instant) { if (el.classList.contains('many')) el.scrollTo({ left: k._c - el.clientWidth / 2, behavior: instant ? 'auto' : 'smooth' }); };
    c.align = function () {                   // görünmeden önce anında ortala: kartlar kayarak değil hazır gelir
      c.layout(); var kids = el.children;
      if (kids.length && el.classList.contains('many')) el.scrollLeft = kids[Math.floor((kids.length - 1) / 2)]._c - el.clientWidth / 2;
      else el.scrollLeft = 0;
      c.update();
    };
    c.reflow = function (mutate) {            // FLIP: kartlar yeni yerlerine kayarak geçer
      var old = [].slice.call(el.children), from = old.map(function (k) { return k.getBoundingClientRect().left; });
      mutate(); c.soft();
      old.forEach(function (k, i) {
        if (!k.parentNode || k.classList.contains('gone')) return;
        var dx = from[i] - k.getBoundingClientRect().left;
        if (Math.abs(dx) > 1 && k.animate) k.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.22,.85,.3,1)' });
      });
    };
    c.node = function (id) { return el.querySelector('[data-id="' + id + '"]'); };
    c.build = function () { el.innerHTML = ''; c.ids.forEach(function (id) { el.appendChild(c.make(id)); }); c.layout(); c.update(); };
    c.add = function (id) {
      if (c.ids.indexOf(id) >= 0) return false;
      c.ids.push(id); var b = c.make(id);
      c.reflow(function () { el.appendChild(b); }); c.center(b, !isOpen || el.classList.contains('off')); return true;
    };
    c.remove = function (id) {
      var i = c.ids.indexOf(id); if (i < 0) return false;
      c.ids.splice(i, 1); var b = c.node(id); if (!b) return true;
      b.classList.add('gone');
      setTimeout(function () { c.reflow(function () { if (b.parentNode) b.parentNode.removeChild(b); }); }, 360);
      return true;
    };
    c.mark = function (id) {
      c.held = id || null;
      [].forEach.call(el.children, function (k) {
        var on = k.getAttribute('data-id') === id; k.classList.toggle('on', on); k.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      el.classList.toggle('pick', !!id);
    };
    el.addEventListener('scroll', function () {
      if (el.classList.contains('ease')) el.classList.remove('ease');
      if (!tick) { tick = 1; requestAnimationFrame(function () { tick = 0; c.update(); }); }
    }, { passive: true });
    return c;
  }

  var itemsC = Carousel(document.getElementById('shelf')), fxC = Carousel(document.getElementById('fxShelf'));
  itemsC.ids = ['hat', 'friend', 'demoA', 'demoB', 'demoC'];
  var unseen = { items: false, fx: false }, tab = 'items', isOpen = false;

  /* ---- Sekmeler, yazı, noktalar ---- */
  function idle() { if (!isOpen) return 'envanter'; return tab === 'items' ? 'envanter' : (fxC.ids.length ? 'etkiler' : 'etki yok'); }
  function caption() {
    if (Inventory.held) say(nm(Inventory.held), true, false);
    else if (Inventory.seen) say(nm(Inventory.seen) + ' etkisi', true, true);
    else say(idle(), false, false);
  }
  function placeInk() {
    var b = tabs.querySelector('.on'); if (!b) return;
    ink.style.width = b.offsetWidth + 'px'; ink.style.transform = 'translateX(' + b.offsetLeft + 'px)';
  }
  function counts() {
    document.getElementById('nI').textContent = itemsC.ids.length || '';
    document.getElementById('nF').textContent = fxC.ids.length || '';
    placeInk();
  }
  function dots() {
    [].forEach.call(tabs.querySelectorAll('button'), function (b) { b.classList.toggle('dot', !!unseen[b.getAttribute('data-t')]); });
    cap.classList.toggle('dot', !isOpen && (unseen.items || unseen.fx));
  }
  function note(kind) { if (!isOpen || tab !== kind) { unseen[kind] = true; dots(); } }

  var Inventory = window.Inventory = {
    items: itemsC.ids, effects: fxC.ids, effectFlags: ['kelepce'], held: null, seen: null,
    add: function (id) { if (itemsC.add(id)) { counts(); note('items'); } },
    select: function (id, silent) {
      this.held = id || null; itemsC.mark(id);
      if (id && this.seen) { this.seen = null; fxC.mark(null); }
      if (!silent) caption();
      stage.dispatchEvent(new CustomEvent('hold', { detail: { id: this.held } }));
    },
    addEffect: function (id) {
      if (fxC.add(id)) { counts(); note('fx'); if (tab === 'fx') caption(); stage.dispatchEvent(new CustomEvent('effects', { detail: { effects: fxC.ids.slice() } })); }
    },
    removeEffect: function (id) {
      if (this.seen === id) this.inspect(null);
      if (fxC.remove(id)) { counts(); if (tab === 'fx') caption(); stage.dispatchEvent(new CustomEvent('effects', { detail: { effects: fxC.ids.slice() } })); }
    },
    inspect: function (id) {
      this.seen = id || null; fxC.mark(id);
      if (id && this.held) this.select(null, true);       // eşya bırakılır, yazıyı etki devralır
      caption();
    },
    setTab: function (t) {
      if (t === tab) return;
      if (this.held) this.select(null, true);
      if (this.seen) this.inspect(null);
      tab = t; unseen[t] = false;
      document.getElementById('shelf').classList.toggle('off', t !== 'items');
      document.getElementById('fxShelf').classList.toggle('off', t !== 'fx');
      [].forEach.call(tabs.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
      if (t === 'fx') fxC.align();
      placeInk(); dots(); caption();
    },
    open: function () {
      isOpen = true; inv.classList.add('open');
      unseen[tab] = false; dots(); caption(); itemsC.layout(); itemsC.update(); if (tab === 'fx') fxC.align(); else { fxC.layout(); fxC.update(); } placeInk(); fitSlot();
    },
    close: function () {
      isOpen = false; inv.classList.remove('open');
      if (this.held) this.select(null, true); if (this.seen) this.inspect(null);
      dots(); caption();
    },
    toggle: function () { if (isOpen) this.close(); else this.open(); }
  };
  Inventory.selectEffect = function (id) { Inventory.inspect(id); };

  ['pointerdown', 'pointerup'].forEach(function (n) { inv.addEventListener(n, function (e) { e.stopPropagation(); }); });
  cap.addEventListener('click', function (e) {          // alt yazı: kapalıyken açar; açıkken ve kart seçili değilken kapatır
    e.stopPropagation();
    if (!isOpen) Inventory.open();
    else if (!Inventory.held && !Inventory.seen) Inventory.close();
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
  });
  tabs.addEventListener('click', function (e) { e.stopPropagation(); var b = e.target.closest('button'); if (b) Inventory.setTab(b.getAttribute('data-t')); });

  itemsC.el.addEventListener('click', function (e) {
    e.stopPropagation();
    var c = e.target.closest('.ic');
    if (!c) { if (Inventory.held) Inventory.select(null); return; }
    var id = c.getAttribute('data-id'), was = Inventory.held === id;
    Inventory.select(was ? null : id);
    if (!was) itemsC.center(c);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
  });
  fxC.el.addEventListener('click', function (e) {
    e.stopPropagation();
    var c = e.target.closest('.ic');
    if (!c) { if (Inventory.seen) Inventory.inspect(null); return; }
    var id = c.getAttribute('data-id'), was = Inventory.seen === id;
    Inventory.inspect(was ? null : id);
    if (!was) fxC.center(c);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
  });

  function syncFx() {                          // hikâye bayraklarından etkiler
    var f = (window.Game && Game.state && Game.state.flags) || {};
    Inventory.effectFlags.forEach(function (id) { if (f[id]) Inventory.addEffect(id); else Inventory.removeEffect(id); });
  }
  stage.addEventListener('card', function () { inv.classList.remove('away'); syncFx(); });
  stage.addEventListener('end', function () { inv.classList.add('away'); syncFx(); });
  document.body.addEventListener('click', function () {                // boş alana dokunulunca seçim bırakılır
    if (!document.body.classList.contains('playing')) return;
    if (Inventory.held) Inventory.select(null); else if (Inventory.seen) Inventory.inspect(null);
  });

  itemsC.build(); fxC.build(); counts(); fitSlot();
  var rl = 0; function relayout() { clearTimeout(rl); rl = setTimeout(function () { itemsC.soft(); fxC.soft(); fitSlot(); placeInk(); }, 60); }
  window.addEventListener('resize', relayout); window.addEventListener('load', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(itemsC.el);

  var wasPlaying = false;
  new MutationObserver(function () {
    var pl = document.body.classList.contains('playing');
    if (pl === wasPlaying) return; wasPlaying = pl;
    if (pl) { demoEffects.forEach(function (id, i) { setTimeout(function () { Inventory.addEffect(id); }, 600 + i * 200); }); return; }
    Inventory.close(); inv.classList.remove('away');   // menüye çıkış: her şey sıfırlanır
    if (Inventory.seen) Inventory.inspect(null);
    fxC.ids.length = 0; fxC.build(); unseen.items = unseen.fx = false; Inventory.setTab('items'); counts(); dots();
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
</body>
</html>
